
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f5ef">
  <title>Una invitación especial</title>

  <style>
    :root {
      --fondo: #f8f5ef;
      --dorado: #a88750;
      --texto: #39352f;
      --blanco: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--fondo);
      color: var(--texto);
      font-family: Georgia, "Times New Roman", serif;
    }

    .pantalla-inicial {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background:
        radial-gradient(ellipse at top, #fffdf8, var(--fondo));
    }

    .detalle {
      color: var(--dorado);
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(30px, 8vw, 46px);
      font-weight: normal;
      margin: 0 0 14px;
    }

    .subtitulo {
      font-size: 16px;
      line-height: 1.7;
      max-width: 320px;
      margin: 0 0 30px;
    }

    .boton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 14px 24px;
      border: 1px solid var(--dorado);
      border-radius: 3px;
      background: var(--dorado);
      color: var(--blanco);
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .boton:hover {
      background: transparent;
      color: var(--dorado);
    }

    .boton-secundario {
      background: transparent;
      color: var(--dorado);
    }

    #video {
      display: none;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      object-fit: contain;
      background: #000;
    }

    #invitacion {
      display: none;
      min-height: 100vh;
      padding: 20px 16px 36px;
      text-align: center;
      animation: aparecer 1s ease;
    }

    .marco {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 8px;
      border: 1px solid #d8c7a8;
      background: var(--blanco);
    }

    .imagen-invitacion {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .texto-final {
      margin: 24px auto 18px;
      font-size: 17px;
      line-height: 1.7;
    }

    .botones {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 340px;
      margin: 22px auto 0;
      font-family: Arial, sans-serif;
    }

    .pie {
      margin-top: 28px;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--dorado);
      text-transform: uppercase;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #invitacion {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main>
    <!-- PRIMERA PANTALLA -->
    <section class="pantalla-inicial" id="inicio">
      <div class="detalle">Una ocasión especial</div>

      <h1>Una invitación<br>para ti</h1>

      <p class="subtitulo">
        Hay momentos que merecen compartirse.
        Nos encantaría que formaras parte de este.
      </p>

      <button class="boton" id="abrir">
        Abrir invitación
      </button>
    </section>

    <!-- VIDEO CON MÚSICA -->
    <video
      id="video"
      playsinline
      preload="auto"
      aria-label="Video de la invitación"
    >
<source src="VID-20261010-WA0107(1).mp4" type="video/mp4">
      Tu navegador no puede reproducir este video.
    </video>

    <!-- INVITACIÓN FINAL -->
    <section id="invitacion">
      <div class="detalle">Estás cordialmente invitado</div>

      <div class="marco">
        <img
      class="imagen-invitacion"
      src="IMG-20261017-WA0048.jpg"
      alt="Diseño de la invitación con los detalles del evento"
        >
      </div>

      <p class="texto-final">
        Será un gusto compartir este momento contigo.
      </p>

      <div class="botones">
        <a
          class="boton"
          href="https://maps.app.goo.gl/17ycA9XPWuscxHXcA"
          target="_blank"
          rel="noopener noreferrer"
        >
          Ver ubicación
        </a>

        <a
          class="boton boton-secundario"
          href="https://forms.gle/qB59GxUzvUp7zEJZ7"
          target="_blank"
          rel="noopener noreferrer"
        >
          Confirmar asistencia
        </a>
      </div>

      <div class="pie">Con cariño</div>
    </section>
  </main>

  <script>
    const inicio = document.getElementById("inicio");
    const video = document.getElementById("video");
    const invitacion = document.getElementById("invitacion");
    const abrir = document.getElementById("abrir");

    function mostrarInvitacion() {
      video.pause();
      video.style.display = "none";
      inicio.style.display = "none";
      invitacion.style.display = "block";
      window.scrollTo(0, 0);
    }

    abrir.addEventListener("click", async () => {
      inicio.style.display = "none";
      video.style.display = "block";

      try {
        video.currentTime = 0;
        await video.play();
      } catch (error) {
        video.style.display = "none";
        inicio.style.display = "flex";
        alert(
          "No se pudo reproducir el video. Comprueba que video.mp4 esté subido correctamente."
        );
      }
    });

    video.addEventListener("ended", mostrarInvitacion);

    video.addEventListener("error", () => {
      if (video.style.display === "block") {
        video.style.display = "none";
        inicio.style.display = "flex";
        alert(
          "No se pudo cargar el video. Verifica el archivo video.mp4."
        );
      }
    });
  </script>

</body>
</html>
